name: iCal OTA Sync

# Sincroniza los calendarios de Booking/Expedia con el motor de reservas.
# Llama al endpoint del cron en producción cada 15 minutos.
# Requiere el secreto de repositorio CRON_SECRET (debe coincidir con el de Railway).

# NOTA: el sync automático corre DENTRO del servidor (lib/ical-scheduler.ts, cada 15 min,
# una sola réplica en Railway). Este workflow ya NO se dispara por horario para evitar un
# SEGUNDO disparador que se traslapaba con el interno y borraba bloqueos de Disponibilidad.
# Queda solo como respaldo MANUAL (Actions → Run workflow) por si el scheduler interno
# estuviera caído. Si algún día se re-activa el horario, debe ser el ÚNICO disparador.
on:
  workflow_dispatch: {}        # solo manual, desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sincronización iCal
        run: |
          curl -fsS -X GET "https://www.paraisoencantado.com/api/cron/ical-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 90
